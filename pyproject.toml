[build-system]
requires = ["maturin>=1.2.3,<2"]
build-backend = "maturin"

[project]
name = "y-py-dart"
dynamic = ["version"]
description = "Python bindings for the Y-CRDT built from yrs (Rust)"
license = { file = "LICENSE" }
authors = [
    { name = "John Waidhofer", email = "waidhoferj@gmail.com" },
    { name = "Kevin Jahns", email = "kevin.jahns@protonmail.com" },
    { name = "Pierre-Olivier Simonard", email = "pierre.olivier.simonard@gmail.com" }
]
readme = "README.md"
keywords = [
    "crdt",
]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python",
    "Programming Language :: Python :: 3.8",
    "Programming Language :: Python :: 3.9",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
    "Programming Language :: Rust",
]

[project.urls]
Homepage = "https://github.com/its-dart/ypy"
Source = "https://github.com/its-dart/ypy"
Issues = "https://github.com/its-dart/ypy/issues"
Pypi = "https://pypi.org/project/y-py-dart"

[tool.hatch.envs.test]
dependencies = ["pytest", "maturin"]

[[tool.hatch.envs.test.matrix]]
python = ["38", "39", "310", "311", "312", "313", "314"]
